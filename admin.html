<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت رزرو | چایباغ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazirmatn', 'Segoe UI', sans-serif;
            background: #f0f4f8;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            max-width: 500px;
            width: 100%;
            padding: 32px 28px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h2 {
            text-align: center;
            color: #0f172a;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .sub {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d9e6;
            border-radius: 12px;
            font-size: 14px;
            transition: 0.2s;
            background: #fafcff;
        }
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover {
            background: #1d4ed8;
            transform: scale(1.01);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }
        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }
        .link-admin {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            font-size: 13px;
        }
        .link-admin a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .link-admin a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🏡 ثبت رزرو چایباغ</h2>
        <div class="sub">اطلاعات خود را وارد کنید</div>

        <form id="reservationForm">
            <div class="form-group">
                <label>نام و نام خانوادگی</label>
                <input type="text" id="name" placeholder="مثال: فربد یداللهی" required>
            </div>

            <div class="form-group">
                <label>شماره تلفن</label>
                <input type="tel" id="phone" placeholder="۰۹۱۲۳۴۵۶۷۸۹" required>
            </div>

            <div class="form-group">
                <label>تاریخ ورود</label>
                <input type="date" id="checkin" required>
            </div>

            <div class="form-group">
                <label>تاریخ خروج</label>
                <input type="date" id="checkout" required>
            </div>

            <div class="form-group">
                <label>تعداد مهمانان</label>
                <input type="number" id="guests" min="1" max="20" placeholder="مثلاً ۲" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">ثبت رزرو</button>
        </form>

        <div id="message" class="message"></div>

        <div class="link-admin">
            👤 <a href="admin.html">ورود به پنل مدیریت</a>
        </div>
    </div>

    <script>
        // ================================================================
        // ثبت رزرو جدید در localStorage
        // ================================================================
        document.getElementById('reservationForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const checkin = document.getElementById('checkin').value;
            const checkout = document.getElementById('checkout').value;
            const guests = document.getElementById('guests').value.trim();

            // اعتبارسنجی ساده
            if (!name || !phone || !checkin || !checkout || !guests) {
                showMessage('لطفاً همه فیلدها را پر کنید.', 'error');
                return;
            }

            if (phone.length < 10) {
                showMessage('شماره تلفن معتبر نیست.', 'error');
                return;
            }

            if (new Date(checkin) > new Date(checkout)) {
                showMessage('تاریخ ورود نمی‌تواند از تاریخ خروج جدیدتر باشد.', 'error');
                return;
            }

            // ============================================================
            // ★★★ نکته مهم: تاریخ ورود و خروج به فرمت YYYY-MM-DD ذخیره می‌شود ★★★
            // ============================================================

            // ساخت آبجکت رزرو
            const reservation = {
                name: name,
                phone: phone,
                checkin: checkin,          // ← فرمت: 2026-07-28
                checkout: checkout,        // ← فرمت: 2026-07-30
                guests: guests,
                createdAt: new Date().toISOString() // ← زمان ثبت به میلادی
            };

            // دریافت رزروهای قبلی
            let reservations = JSON.parse(localStorage.getItem('reservations')) || [];

            // اضافه کردن رزرو جدید
            reservations.push(reservation);

            // ذخیره در localStorage
            localStorage.setItem('reservations', JSON.stringify(reservations));

            // پیام موفقیت
            showMessage('✅ رزرو شما با موفقیت ثبت شد!', 'success');

            // خالی کردن فرم
            document.getElementById('reservationForm').reset();

            // غیرفعال کردن دکمه برای ۲ ثانیه (جلوگیری از ثبت تکراری)
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            setTimeout(() => { btn.disabled = false; }, 2000);
        });

        // ================================================================
        // نمایش پیام
        // ================================================================
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            // بعد از ۴ ثانیه پیام را مخفی کن
            clearTimeout(window.msgTimeout);
            window.msgTimeout = setTimeout(() => {
                msg.className = 'message';
            }, 4000);
        }

        // ================================================================
        // تنظیم حداقل تاریخ ورود به امروز (اختیاری)
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('checkin').setAttribute('min', today);
            document.getElementById('checkout').setAttribute('min', today);
        });

        // وقتی تاریخ ورود تغییر کرد، حداقل تاریخ خروج را به‌روز کن
        document.getElementById('checkin').addEventListener('change', function() {
            const checkinVal = this.value;
            document.getElementById('checkout').setAttribute('min', checkinVal);
            if (document.getElementById('checkout').value < checkinVal) {
                document.getElementById('checkout').value = '';
            }
        });
    </script>

</body>
</html>
