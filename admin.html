<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت رزروها</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            background: #f1f5f9;
            padding: 20px;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== صفحه ورود ===== */
        .login-container {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .login-container h2 {
            font-size: 26px;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .login-container .sub {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-container .form-group {
            margin-bottom: 18px;
            text-align: right;
        }
        .login-container label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .login-container input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: 0.2s;
            background: #fafcff;
        }
        .login-container input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }
        .login-container .btn-login {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }
        .login-container .btn-login:hover {
            background: #1d4ed8;
            transform: scale(1.01);
        }
        .login-container .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
        .login-container .error.show {
            display: block;
        }

        /* ===== پنل اصلی (بعد از ورود) ===== */
        .panel-container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 28px 30px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            width: 100%;
            display: none;
        }
        .panel-container .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 6px;
        }
        .panel-container .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
        }
        .panel-container .header .sub {
            color: #64748b;
            font-size: 14px;
            margin-top: 2px;
        }
        .panel-container .header .back-link {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            transition: 0.2s;
        }
        .panel-container .header .back-link:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .panel-container .header .logout-btn {
            background: transparent;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 14px;
            color: #dc2626;
            cursor: pointer;
            transition: 0.2s;
        }
        .panel-container .header .logout-btn:hover {
            background: #fef2f2;
            border-color: #dc2626;
        }
        .panel-container .header .left-btns {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin: 22px 0 26px 0;
        }
        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 16px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-top: 4px;
        }
        .stat-card.highlight .number {
            color: #2563eb;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e9edf2;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 40px;
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-print {
            background: #1e293b;
        }
        .btn-print:hover {
            background: #0f172a;
            transform: scale(1.02);
        }
        .btn-danger {
            background: #dc2626;
        }
        .btn-danger:hover {
            background: #b91c1c;
            transform: scale(1.02);
        }
        .btn-sm {
            padding: 4px 14px;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            background: #ef4444;
            height: 28px;
            transition: 0.15s;
        }
        .btn-sm:hover {
            background: #dc2626;
        }
        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e9edf2;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 750px;
        }
        th {
            background: #f8fafc;
            color: #334155;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 12px 10px;
            border-bottom: 2px solid #e2e8f0;
            text-align: center;
        }
        td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #eef2f6;
            color: #1e293b;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: #fafcff;
        }
        .badge {
            background: #e9edf2;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
        }
        .empty {
            padding: 50px 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 15px;
        }
        .date-miladi {
            font-size: 11px;
            color: #94a3b8;
            display: block;
            margin-top: 2px;
        }

        @media print {
            body {
                background: #fff;
                padding: 10px;
            }
            .toolbar {
                display: none !important;
            }
            .panel-container {
                box-shadow: none;
                border: 1px solid #ddd;
                padding: 16px;
            }
            .stat-card {
                border: 1px solid #ccc;
                background: #f9f9f9;
            }
            .btn-sm {
                display: none;
            }
            th {
                background: #eee !important;
            }
            .header .left-btns {
                display: none !important;
            }
        }
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .panel-container {
                padding: 16px;
            }
            .panel-container .header h1 {
                font-size: 20px;
            }
            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .toolbar {
                justify-content: center;
            }
            .login-container {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- صفحه ورود -->
    <!-- ============================================================ -->
    <div id="loginPage" class="login-container">
        <h2>🔐 ورود به پنل</h2>
        <div class="sub">لطفاً مشخصات مدیر را وارد کنید</div>

        <div class="form-group">
            <label>نام کاربری</label>
            <input type="text" id="usernameInput" placeholder="admin" value="admin">
        </div>
        <div class="form-group">
            <label>رمز عبور</label>
            <input type="password" id="passwordInput" placeholder="********">
        </div>

        <button class="btn-login" onclick="login()">ورود</button>
        <div id="loginError" class="error">نام کاربری یا رمز عبور اشتباه است.</div>
    </div>

    <!-- ============================================================ -->
    <!-- پنل مدیریت (بعد از ورود) -->
    <!-- ============================================================ -->
    <div id="panelPage" class="panel-container">

        <!-- هدر با لینک برگشت به سایت و خروج -->
        <div class="header">
            <div>
                <h1>📋 مدیریت رزروها</h1>
                <div class="sub">پنل ادمین · مشاهده و حذف رزروها</div>
            </div>
            <div class="left-btns">
                <a href="index.html" class="back-link">🏠 بازگشت به سایت</a>
                <button class="logout-btn" onclick="logout()">خروج</button>
            </div>
        </div>

        <!-- آمار -->
        <div class="stats">
            <div class="stat-card highlight">
                <div class="label">مجموع رزروها</div>
                <div class="number" id="totalCount">۰</div>
            </div>
            <div class="stat-card">
                <div class="label">📅 رزروهای امروز</div>
                <div class="number" id="todayCount">۰</div>
            </div>
        </div>

        <!-- دکمه‌ها -->
        <div class="toolbar no-print">
            <button class="btn btn-print" onclick="window.print()">🖨️ چاپ</button>
            <button class="btn btn-danger" onclick="clearAll()">🗑️ حذف همه</button>
        </div>

        <!-- لیست رزروها -->
        <div id="reservationsList">
            <div class="empty">در حال بارگذاری...</div>
        </div>

    </div>

    <script>
        // ================================================================
        // اطلاعات ورود (سخت‌کد شده)
        // ================================================================
        const ADMIN_USER = 'admin';
        const ADMIN_PASS = '13859358';

        // ================================================================
        // توابع ورود و خروج
        // ================================================================
        function login() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorEl = document.getElementById('loginError');

            if (username === ADMIN_USER && password === ADMIN_PASS) {
                // ذخیره در sessionStorage برای ماندگاری در همان جلسه
                sessionStorage.setItem('adminLoggedIn', 'true');
                showPanel();
                errorEl.classList.remove('show');
            } else {
                errorEl.classList.add('show');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            showLogin();
        }

        // ================================================================
        // نمایش/مخفی کردن صفحات
        // ================================================================
        function showPanel() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('panelPage').style.display = 'block';
            loadReservations(); // بارگذاری داده‌ها
        }

        function showLogin() {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('panelPage').style.display = 'none';
            document.getElementById('loginError').classList.remove('show');
            document.getElementById('usernameInput').value = 'admin';
            document.getElementById('passwordInput').value = '';
        }

        // ================================================================
        // بررسی وضعیت ورود در هنگام بارگذاری صفحه
        // ================================================================
        window.onload = function() {
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                showPanel();
            } else {
                showLogin();
            }
        };

        // ================================================================
        // توابع تبدیل تاریخ
        // ================================================================
        function toPersianDate(dateStr) {
            if (!dateStr) return '-';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleDateString('fa-IR', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    timeZone: 'Asia/Tehran'
                });
            } catch {
                return dateStr;
            }
        }

        function toPersianDateTime(dateStr) {
            if (!dateStr) return '-';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleDateString('fa-IR', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    timeZone: 'Asia/Tehran'
                });
            } catch {
                return dateStr;
            }
        }

        // ================================================================
        // اصلاح داده‌ها (اضافه کردن createdAt به رزروهای قدیمی)
        // ================================================================
        function fixReservationsData() {
            let data = JSON.parse(localStorage.getItem('reservations')) || [];
            let changed = false;
            for (let i = 0; i < data.length; i++) {
                if (!data[i].createdAt) {
                    data[i].createdAt = new Date().toISOString();
                    changed = true;
                }
            }
            if (changed) {
                localStorage.setItem('reservations', JSON.stringify(data));
            }
            return data;
        }

        // ================================================================
        // بارگذاری و نمایش رزروها
        // ================================================================
        function loadReservations() {
            const container = document.getElementById('reservationsList');
            let data = fixReservationsData();
            updateStats(data);

            if (data.length === 0) {
                container.innerHTML = '<div class="empty">هیچ رزروی ثبت نشده است.</div>';
                return;
            }

            let html = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>نام</th>
                                <th>تلفن</th>
                                <th>تاریخ ورود</th>
                                <th>تاریخ خروج</th>
                                <th>تعداد مهمان</th>
                                <th>تاریخ ثبت</th>
                                <th>عملیات</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            data.forEach((item, index) => {
                const checkinPersian = toPersianDate(item.checkin);
                const checkoutPersian = toPersianDate(item.checkout);
                const createdAtPersian = toPersianDateTime(item.createdAt);

                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.name || '-'}</td>
                        <td>${item.phone || '-'}</td>
                        <td>
                            ${checkinPersian}
                            <span class="date-miladi">${item.checkin || '-'}</span>
                        </td>
                        <td>
                            ${checkoutPersian}
                            <span class="date-miladi">${item.checkout || '-'}</span>
                        </td>
                        <td><span class="badge">${item.guests || '۰'}</span></td>
                        <td>${createdAtPersian}</td>
                        <td>
                            <button class="btn-sm" onclick="deleteReservation(${index})">حذف</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        // ================================================================
        // آمار
        // ================================================================
        function updateStats(data) {
            document.getElementById('totalCount').innerText = data.length;

            const today = new Date();
            const todayStr =
                today.getFullYear() + '-' +
                String(today.getMonth() + 1).padStart(2, '0') + '-' +
                String(today.getDate()).padStart(2, '0');

            const todayReserves = data.filter(item => item.checkin === todayStr).length;
            document.getElementById('todayCount').innerText = todayReserves;
        }

        // ================================================================
        // حذف تکی
        // ================================================================
        function deleteReservation(index) {
            if (!confirm('آیا از حذف این رزرو اط
