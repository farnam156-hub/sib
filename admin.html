<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت رزروها</title>
    <style>
        /* ----- تنظیمات پایه ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            background: #f1f5f9;
            padding: 20px;
            color: #0f172a;
        }

        /* ----- کانتینر اصلی ----- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 28px 30px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        /* ----- هدر ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 6px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
        }
        .header .sub {
            color: #64748b;
            font-size: 14px;
            margin-top: 2px;
        }

        /* ----- کارت‌های آمار ----- */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin: 22px 0 26px 0;
        }
        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 16px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-top: 4px;
        }
        .stat-card.highlight .number {
            color: #2563eb;
        }

        /* ----- نوار ابزار ----- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e9edf2;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 40px;
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-print {
            background: #1e293b;
        }
        .btn-print:hover {
            background: #0f172a;
            transform: scale(1.02);
        }
        .btn-danger {
            background: #dc2626;
        }
        .btn-danger:hover {
            background: #b91c1c;
            transform: scale(1.02);
        }

        /* ----- دکمه حذف تکی ----- */
        .btn-sm {
            padding: 4px 14px;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            background: #ef4444;
            height: 28px;
            transition: 0.15s;
        }
        .btn-sm:hover {
            background: #dc2626;
        }

        /* ----- جدول ----- */
        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e9edf2;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 600px;
        }
        th {
            background: #f8fafc;
            color: #334155;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 12px 10px;
            border-bottom: 2px solid #e2e8f0;
            text-align: center;
        }
        td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #eef2f6;
            color: #1e293b;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: #fafcff;
        }

        .badge {
            background: #e9edf2;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
        }

        .empty {
            padding: 50px 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 15px;
        }

        /* ----- حالت چاپ ----- */
        @media print {
            body {
                background: #fff;
                padding: 10px;
            }
            .toolbar {
                display: none !important;
            }
            .container {
                box-shadow: none;
                border: 1px solid #ddd;
                padding: 16px;
            }
            .stat-card {
                border: 1px solid #ccc;
                background: #f9f9f9;
            }
            .btn-sm {
                display: none;
            }
            th {
                background: #eee !important;
            }
        }

        /* ----- موبایل ----- */
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 16px;
            }
            .header h1 {
                font-size: 20px;
            }
            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .toolbar {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- هدر -->
        <div class="header">
            <div>
                <h1>📋 مدیریت رزروها</h1>
                <div class="sub">پنل ادمین · مشاهده و حذف رزروها</div>
            </div>
        </div>

        <!-- آمار -->
        <div class="stats">
            <div class="stat-card highlight">
                <div class="label">مجموع رزروها</div>
                <div class="number" id="totalCount">۰</div>
            </div>
            <div class="stat-card">
                <div class="label">📅 رزروهای امروز</div>
                <div class="number" id="todayCount">۰</div>
            </div>
        </div>

        <!-- دکمه‌ها -->
        <div class="toolbar no-print">
            <button class="btn btn-print" onclick="window.print()">🖨️ چاپ</button>
            <button class="btn btn-danger" onclick="clearAll()">🗑️ حذف همه</button>
        </div>

        <!-- لیست رزروها -->
        <div id="reservationsList">
            <div class="empty">در حال بارگذاری...</div>
        </div>

    </div>

    <script>
        // ================================================================
        // 1. تبدیل تاریخ میلادی به شمسی (فارسی)
        // ================================================================
        function toPersianDate(dateStr) {
            if (!dateStr) return '-';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleDateString('fa-IR', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } catch {
                return dateStr;
            }
        }

        // ================================================================
        // 2. بارگذاری و نمایش رزروها
        // ================================================================
        function loadReservations() {
            const container = document.getElementById('reservationsList');

            // دریافت داده از localStorage
            let data = JSON.parse(localStorage.getItem('reservations')) || [];

            // ★★★ اصلاح خودکار: به رزروهای بدون createdAt، تاریخ امروز را اضافه کن ★★★
            let changed = false;
            data = data.map(item => {
                if (!item.createdAt) {
                    item.createdAt = new Date().toISOString();
                    changed = true;
                }
                return item;
            });
            if (changed) {
                localStorage.setItem('reservations', JSON.stringify(data));
            }

            // بروزرسانی آمار
            updateStats(data);

            // اگر رزروی وجود نداشت
            if (data.length === 0) {
                container.innerHTML = '<div class="empty">هیچ رزروی ثبت نشده است.</div>';
                return;
            }

            // ساخت جدول
            let html = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>نام</th>
                                <th>تلفن</th>
                                <th>تاریخ ورود</th>
                                <th>تاریخ خروج</th>
                                <th>تعداد مهمان</th>
                                <th>تاریخ ثبت</th>
                                <th>عملیات</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            data.forEach((item, index) => {
                // تاریخ ورود و خروج را همان‌طور که هست نمایش بده
                const checkin = item.checkin || '-';
                const checkout = item.checkout || '-';
                // تاریخ ثبت را به شمسی تبدیل کن
                const createdAtPersian = toPersianDate(item.createdAt);

                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.name || '-'}</td>
                        <td>${item.phone || '-'}</td>
                        <td>${checkin}</td>
                        <td>${checkout}</td>
                        <td><span class="badge">${item.guests || '۰'}</span></td>
                        <td>${createdAtPersian}</td>
                        <td>
                            <button class="btn-sm" onclick="deleteReservation(${index})">حذف</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        // ================================================================
        // 3. بروزرسانی آمار (مجموع و رزروهای امروز)
        // ================================================================
        function updateStats(data) {
            // مجموع رزروها
            document.getElementById('totalCount').innerText = data.length;

            // محاسبه رزروهای امروز (با فرمت میلادی YYYY-MM-DD)
            const today = new Date();
            const todayStr =
                today.getFullYear() + '-' +
                String(today.getMonth() + 1).padStart(2, '0') + '-' +
                String(today.getDate()).padStart(2, '0');

            const todayReserves = data.filter(item => item.checkin === todayStr).length;
            document.getElementById('todayCount').innerText = todayReserves;
        }

        // ================================================================
        // 4. حذف یک رزرو
        // ================================================================
        function deleteReservation(index) {
            if (!confirm('آیا از حذف این رزرو اطمینان دارید؟')) return;

            let data = JSON.parse(localStorage.getItem('reservations')) || [];
            data.splice(index, 1);
            localStorage.setItem('reservations', JSON.stringify(data));
            loadReservations(); // ریلود لیست
        }

        // ================================================================
        // 5. حذف همه رزروها
        // ================================================================
        function clearAll() {
            if (!confirm('⚠️ همه رزروها به طور دائمی حذف شوند؟')) return;

            localStorage.removeItem('reservations');
            loadReservations();
        }

        // ================================================================
        // 6. بارگذاری اولیه
        // ================================================================
        window.onload = loadReservations;
    </script>

</body>
</html>
