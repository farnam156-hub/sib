<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل ادمین حرفه‌ای | رزروها</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', 'Segoe UI', sans-serif;
            background: #e8f0fe;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #1B4332;
            border-bottom: 3px solid #52B788;
            padding-bottom: 10px;
            margin-top: 0;
        }
        /* استایل باکس آمار */
        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .stat-box {
            background: #f0f9f4;
            padding: 10px 25px;
            border-radius: 30px;
            border-right: 5px solid #1B4332;
            font-weight: bold;
            color: #1B4332;
        }
        .stat-box span {
            color: #2d6a4f;
            font-size: 1.4em;
        }

        /* جعبه ابزار (جستجو و دکمه‌ها) */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
        }
        .toolbar input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 2px solid #dde4e6;
            border-radius: 30px;
            font-size: 14px;
            transition: 0.3s;
        }
        .toolbar input:focus {
            border-color: #52B788;
            outline: none;
            box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.2);
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            transition: 0.3s;
            font-size: 14px;
            white-space: nowrap;
        }
        .btn:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }
        .btn-green { background: #2d6a4f; }
        .btn-blue { background: #1e6091; }
        .btn-orange { background: #e76f51; }
        .btn-red { background: #c1121f; }
        .btn-purple { background: #6b4c3a; }

        /* جدول */
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 12px 8px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background: #1B4332;
            color: #fff;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background: #fafcfa;
        }
        tr:hover {
            background: #e9f5ef;
        }
        .empty {
            text-align: center;
            color: #aaa;
            padding: 50px;
            font-size: 1.2rem;
        }
        .action-btns {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 20px;
            border: none;
            color: #fff;
            cursor: pointer;
        }
        .btn-edit { background: #f4a261; }
        .btn-del { background: #e63946; }

        @media print {
            .toolbar, .no-print { display: none; }
            .container { box-shadow: none; }
            body { background: #fff; }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h2>📋 مدیریت رزروهای چایباغ</h2>

    <!-- باکس آمار -->
    <div class="stats" id="stats">
        <div class="stat-box">📊 مجموع رزروها: <span id="totalCount">0</span></div>
        <div class="stat-box">📅 رزروهای امروز: <span id="todayCount">0</span></div>
    </div>

    <!-- نوار ابزار -->
    <div class="toolbar no-print">
        <input type="text" id="searchInput" placeholder="🔍 جستجوی نام یا تلفن..." oninput="filterTable()">
        <div class="btn-group">
            <button class="btn btn-blue" onclick="exportCSV()">📥 خروجی CSV</button>
            <button class="btn btn-purple" onclick="window.print()">🖨️ چاپ</button>
            <button class="btn btn-red" onclick="clearAll()">🗑️ پاک کردن همه</button>
        </div>
    </div>

    <!-- لیست رزروها -->
    <div id="reservationsList">
        <p class="empty">در حال بارگذاری...</p>
    </div>
</div>

<script>
    // ============================
    // 1. تابع اصلی بارگذاری و رندر جدول
    // ============================
    function loadReservations() {
        const list = document.getElementById('reservationsList');
        let data = JSON.parse(localStorage.getItem('reservations')) || [];

        // --- اضافه کردن تاریخ ثبت به رزروهای قدیمی (برای اطمینان) ---
        let changed = false;
        data = data.map(item => {
            if (!item.createdAt) {
                item.createdAt = new Date().toISOString();
                changed = true;
            }
            return item;
        });
        if (changed) {
            localStorage.setItem('reservations', JSON.stringify(data));
        }

        // --- بروزرسانی آمار ---
        updateStats(data);

        // --- اگر داده‌ای وجود نداشت ---
        if (data.length === 0) {
            list.innerHTML = '<p class="empty">🎯 هیچ رزروی ثبت نشده است.</p>';
            return;
        }

        // --- ساخت جدول ---
        let html = `<div class="table-responsive"><table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>نام</th>
                    <th>تلفن</th>
                    <th>تاریخ ورود</th>
                    <th>تاریخ خروج</th>
                    <th>تعداد مهمان</th>
                    <th>تاریخ ثبت</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="tableBody">`;

        data.forEach((item, index) => {
            // فرمت تاریخ ثبت به شمسی
            let registerDate = '-';
            if (item.createdAt) {
                const d = new Date(item.createdAt);
                registerDate = d.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });
            }

            html += `<tr data-index="${index}">
                <td>${index + 1}</td>
                <td class="col-name">${item.name || '-'}</td>
                <td class="col-phone">${item.phone || '-'}</td>
                <td>${item.checkin || '-'}</td>
                <td>${item.checkout || '-'}</td>
                <td>${item.guests || '-'}</td>
                <td>${registerDate}</td>
                <td>
                    <div class="action-btns">
                        <button class="btn-sm btn-edit" onclick="editReservation(${index})">✏️</button>
                        <button class="btn-sm btn-del" onclick="deleteReservation(${index})">🗑️</button>
                    </div>
                </td>
            </tr>`;
        });

        html += `</tbody></table></div>`;
        list.innerHTML = html;
    }

    // ============================
    // 2. بروزرسانی آمار
    // ============================
    function updateStats(data) {
        document.getElementById('totalCount').innerText = data.length;

        // محاسبه رزروهای امروز (بر اساس تاریخ ورود)
        const today = new Date().toLocaleDateString('fa-IR');
        let todayReserves = 0;
        data.forEach(item => {
            if (item.checkin) {
                // تاریخ ورود را به فرمت عددی قابل مقایسه تبدیل می‌کنیم
                if (item.checkin === today) {
                    todayReserves++;
                }
            }
        });
        document.getElementById('todayCount').innerText = todayReserves;
    }

    // ============================
    // 3. جستجو / فیلتر
    // ============================
    function filterTable() {
        const input = document.getElementById('searchInput');
        const filter = input.value.toLowerCase().trim();
        const rows = document.querySelectorAll('#tableBody tr');
        if (!rows.length) return;

        rows.forEach(row => {
            const name = row.querySelector('.col-name')?.innerText?.toLowerCase() || '';
            const phone = row.querySelector('.col-phone')?.innerText?.toLowerCase() || '';
            if (name.includes(filter) || phone.includes(filter)) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }

    // ============================
    // 4. ویرایش رزرو
    // ============================
    function editReservation(index) {
        let data = JSON.parse(localStorage.getItem('reservations')) || [];
        if (index < 0 || index >= data.length) {
            alert('رزرو مورد نظر یافت نشد!');
            return;
        }
        const item = data[index];

        // گرفتن اطلاعات جدید از طریق پنجره‌های گفتگو
        const newName = prompt('نام جدید:', item.name || '');
        if (newName === null) return; // انصراف
        const newPhone = prompt('تلفن جدید:', item.phone || '');
        if (newPhone === null) return;
        const newCheckin = prompt('تاریخ ورود جدید (مثلا 1403/02/15):', item.checkin || '');
        if (newCheckin === null) return;
        const newCheckout = prompt('تاریخ خروج جدید:', item.checkout || '');
        if (newCheckout === null) return;
        const newGuests = prompt('تعداد مهمان جدید:', item.guests || '');
        if (newGuests === null) return;

        // بروزرسانی آبجکت
        data[index] = {
            ...item,
            name: newName.trim() || item.name,
            phone: newPhone.trim() || item.phone,
            checkin: newCheckin.trim() || item.checkin,
            checkout: newCheckout.trim() || item.checkout,
            guests: newGuests.trim() || item.guests,
            // createdAt را حفظ می‌کنیم
        };

        localStorage.setItem('reservations', JSON.stringify(data));
        loadReservations(); // ریلود جدول
        // فیلتر جاری را دوباره اعمال کن
        filterTable();
    }

    // ============================
    // 5. حذف تکی
    // ============================
    function deleteReservation(index) {
        if (!confirm('آیا از حذف این رزرو مطمئن هستید؟')) return;
        let data = JSON.parse(localStorage.getItem('reservations')) || [];
        data.splice(index, 1);
        localStorage.setItem('reservations', JSON.stringify(data));
        loadReservations();
        filterTable(); // اعمال مجدد فیلتر
    }

    // ============================
    // 6. پاک کردن همه
    // ============================
    function clearAll() {
        if (!confirm('⚠️ همه رزروها به طور کامل حذف شوند؟')) return;
        localStorage.removeItem('reservations');
        loadReservations();
    }

    // ============================
    // 7. خروجی CSV (اکسل)
    // ============================
    function exportCSV() {
        let data = JSON.parse(localStorage.getItem('reservations')) || [];
        if (data.length === 0) {
            alert('هیچ داده‌ای برای خروجی وجود ندارد.');
            return;
        }

        // سطر هدر
        let csv = '\uFEFF'; // BOM برای پشتیبانی از فارسی در اکسل
        csv += 'نام,تلفن,تاریخ ورود,تاریخ خروج,تعداد مهمان,تاریخ ثبت\n';

        data.forEach(item => {
            let registerDate = '-';
            if (item.createdAt) {
                registerDate = new Date(item.createdAt).toLocaleDateString('fa-IR');
            }
            csv += `${item.name || ''},${item.phone || ''},${item.checkin || ''},${item.checkout || ''},${item.guests || ''},${registerDate}\n`;
        });

        // دانلود فایل
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `لیست_رزروها_${new Date().toLocaleDateString('fa-IR')}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
    }

    // ============================
    // بارگذاری اولیه
    // ============================
    window.onload = loadReservations;
</script>

</body>
</html>
