<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت رزروها</title>
    <style>
        /* ---------- ریست و فونت ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            background: #f0f4f8;
            padding: 20px;
            color: #1e293b;
        }

        /* ---------- کانتینر اصلی ---------- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            padding: 30px 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        /* ---------- هدر ---------- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 8px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.3px;
        }
        .header .sub {
            color: #64748b;
            font-size: 14px;
            margin-top: 2px;
        }

        /* ---------- کارت‌های آمار ---------- */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin: 24px 0 28px 0;
        }
        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px 18px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
        }
        .stat-card .number {
            font-size: 30px;
            font-weight: 700;
            color: #0f172a;
            margin-top: 4px;
        }
        .stat-card.highlight .number {
            color: #2563eb;
        }

        /* ---------- نوار ابزار (چاپ و حذف همه) ---------- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid #e9edf2;
        }
        .btn {
            padding: 8px 22px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            height: 42px;
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-print {
            background: #1e293b;
        }
        .btn-print:hover {
            background: #0f172a;
            transform: scale(1.02);
        }
        .btn-danger {
            background: #dc2626;
        }
        .btn-danger:hover {
            background: #b91c1c;
            transform: scale(1.02);
        }

        /* ---------- دکمه حذف تکی ---------- */
        .btn-sm {
            padding: 4px 16px;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            background: #ef4444;
            height: 30px;
            transition: 0.15s;
        }
        .btn-sm:hover {
            background: #dc2626;
        }

        /* ---------- جدول ---------- */
        .table-wrap {
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid #e9edf2;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 620px;
        }
        th {
            background: #f8fafc;
            color: #334155;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 14px 12px;
            border-bottom: 2px solid #e2e8f0;
            text-align: center;
        }
        td {
            padding: 14px 12px;
            text-align: center;
            border-bottom: 1px solid #eef2f6;
            color: #1e293b;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: #fafcff;
        }

        .badge {
            background: #e9edf2;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
        }

        .empty {
            padding: 60px 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 15px;
        }

        /* ---------- حالت چاپ ---------- */
        @media print {
            body {
                background: #fff;
                padding: 10px;
            }
            .toolbar {
                display: none !important;
            }
            .container {
                box-shadow: none;
                border: 1px solid #ddd;
                padding: 16px;
            }
            .stat-card {
                border: 1px solid #ccc;
                background: #f9f9f9;
            }
            .btn-sm {
                display: none;
            }
            th {
                background: #eee !important;
            }
        }

        /* ---------- موبایل ---------- */
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 18px;
            }
            .header h1 {
                font-size: 20px;
            }
            .stats {
                grid-template-columns: 1fr 1fr;
            }
            .toolbar {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- هدر -->
        <div class="header">
            <div>
                <h1>📋 مدیریت رزروها</h1>
                <div class="sub">پنل ادمین · مشاهده و حذف رزروها</div>
            </div>
        </div>

        <!-- آمار -->
        <div class="stats">
            <div class="stat-card highlight">
                <div class="label">مجموع رزروها</div>
                <div class="number" id="totalCount">۰</div>
            </div>
            <div class="stat-card">
                <div class="label">📅 رزروهای امروز</div>
                <div class="number" id="todayCount">۰</div>
            </div>
        </div>

        <!-- دکمه‌ها -->
        <div class="toolbar no-print">
            <button class="btn btn-print" onclick="window.print()">🖨️ چاپ</button>
            <button class="btn btn-danger" onclick="clearAll()">🗑️ حذف همه</button>
        </div>

        <!-- لیست رزروها -->
        <div id="reservationsList">
            <div class="empty">در حال بارگذاری...</div>
        </div>

    </div>

    <script>
        // ================================================================
        // ۱. تابع اصلی: بارگذاری و نمایش رزروها
        // ================================================================
        function loadReservations() {
            const container = document.getElementById('reservationsList');

            // دریافت داده از localStorage
            let data = JSON.parse(localStorage.getItem('reservations')) || [];

            // اگر داده‌ای وجود نداشت
            if (data.length === 0) {
                container.innerHTML = '<div class="empty">هیچ رزروی ثبت نشده است.</div>';
                updateStats(data);
                return;
            }

            // ساخت جدول
            let html = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>نام</th>
                                <th>تلفن</th>
                                <th>تاریخ ورود</th>
                                <th>تاریخ خروج</th>
                                <th>تعداد مهمان</th>
                                <th>تاریخ ثبت</th>
                                <th>عملیات</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            data.forEach((item, index) => {
                // تاریخ ثبت را به شمسی نمایش بده
                let registerDate = '-';
                if (item.createdAt) {
                    try {
                        const d = new Date(item.createdAt);
                        if (!isNaN(d.getTime())) {
                            registerDate = d.toLocaleDateString('fa-IR', {
                                year: 'numeric',
                                month: 'long',
                                day: 'numeric'
                            });
                        }
                    } catch { /* ignore */ }
                }

                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.name || '-'}</td>
                        <td>${item.phone || '-'}</td>
                        <td>${item.checkin || '-'}</td>
                        <td>${item.checkout || '-'}</td>
                        <td><span class="badge">${item.guests || '۰'}</span></td>
                        <td>${registerDate}</td>
                        <td>
                            <button class="btn-sm" onclick="deleteReservation(${index})">حذف</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;

            // بروزرسانی آمار
            updateStats(data);
        }

        // ================================================================
        // ۲. تابع آمار (با مقایسه‌ی دقیق تاریخ میلادی)
        // ================================================================
        function updateStats(data) {
            // تعداد کل
            document.getElementById('totalCount').innerText = data.length;

            // ---- محاسبه رزروهای امروز ----
            const today = new Date();
            // تاریخ امروز به فرمت میلادی YYYY-MM-DD
            const todayStr =
                today.getFullYear() + '-' +
                String(today.getMonth() + 1).padStart(2, '0') + '-' +
                String(today.getDate()).padStart(2, '0');

            // فیلتر کردن رزروهایی که تاریخ ورودشان با امروز برابر است
            const todayReserves = data.filter(item => item.checkin === todayStr).length;

            document.getElementById('todayCount').innerText = todayReserves;
        }

        // ================================================================
        // ۳. حذف یک رزرو
        // ================================================================
        function deleteReservation(index) {
            if (!confirm('آیا از حذف این رزرو اطمینان دارید؟')) return;

            let data = JSON.parse(localStorage.getItem('reservations')) || [];
            data.splice(index, 1);
            localStorage.setItem('reservations', JSON.stringify(data));
            loadReservations(); // ریلود لیست
        }

        // ================================================================
        // ۴. حذف همه رزروها
        // ================================================================
        function clearAll() {
            if (!confirm('⚠️ همه رزروها به طور دائمی حذف شوند؟')) return;
            localStorage.removeItem('reservations');
            loadReservations();
        }

        // ================================================================
        // ۵. بارگذاری اولیه
        // ================================================================
        window.onload = loadReservations;
    </script>

</body>
</html>
