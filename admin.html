<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل ادمین | رزروها</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #eef2f0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* هدر */
        .admin-header {
            background: #1B4332;
            color: #fff;
            padding: 16px 24px;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .admin-header h2 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-header h2 i {
            color: #95D5B2;
        }
        .admin-header .back-link {
            color: #95D5B2;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.1);
            padding: 6px 14px;
            border-radius: 30px;
        }
        .admin-header .back-link:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }

        /* کارت اصلی */
        .admin-card {
            background: #fff;
            border-radius: 0 0 12px 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        /* خلاصه آمار */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-box {
            background: #f6f8f7;
            border-radius: 10px;
            padding: 14px 16px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .stat-box .number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1B4332;
        }
        .stat-box .label {
            font-size: 0.8rem;
            color: #5A6270;
        }

        /* لیست کارت‌های رزرو */
        .reservation-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .reservation-item {
            background: #fafcfa;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            transition: 0.2s;
        }
        .reservation-item:hover {
            border-color: #52B788;
            box-shadow: 0 2px 8px rgba(82,183,136,0.08);
        }
        .reservation-item .info {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            align-items: center;
            flex: 1;
        }
        .reservation-item .info .name {
            font-weight: 700;
            color: #1B4332;
            font-size: 1rem;
        }
        .reservation-item .info .detail {
            font-size: 0.85rem;
            color: #5A6270;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .reservation-item .info .detail i {
            color: #52B788;
            width: 16px;
        }
        .reservation-item .actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .reservation-item .actions button {
            border: none;
            background: none;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-delete {
            color: #e74c3c;
            background: #fde8e8;
        }
        .btn-delete:hover {
            background: #f5d0d0;
        }

        /* پیام خالی */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }
        .empty-state i {
            font-size: 3rem;
            color: #d4d9d6;
            margin-bottom: 12px;
        }
        .empty-state p {
            font-size: 1rem;
        }

        /* دکمه‌های پایین */
        .footer-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
            border-top: 1px solid #eef2f0;
            padding-top: 20px;
            flex-wrap: wrap;
        }
        .btn-clear-all {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-clear-all:hover {
            background: #c0392b;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .admin-header { flex-direction: column; align-items: stretch; text-align: center; }
            .admin-header h2 { justify-content: center; font-size: 1.1rem; }
            .admin-header .back-link { justify-content: center; }
            .admin-card { padding: 16px; }
            .stats-row { grid-template-columns: 1fr 1fr; }
            .reservation-item { flex-direction: column; align-items: stretch; }
            .reservation-item .info { gap: 8px; }
            .reservation-item .info .detail { font-size: 0.8rem; }
            .reservation-item .actions { justify-content: flex-end; }
            .footer-actions { justify-content: center; }
        }

        @media (max-width: 480px) {
            .stats-row { grid-template-columns: 1fr; }
            .reservation-item .info .name { font-size: 0.9rem; }
            .reservation-item .info .detail { font-size: 0.75rem; flex-wrap: wrap; }
            .reservation-item .actions button { font-size: 0.75rem; padding: 4px 8px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- هدر -->
    <div class="admin-header">
        <h2><i class="fas fa-user-shield"></i> پنل مدیریت رزروها</h2>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> بازگشت به سایت</a>
    </div>

    <!-- محتوای اصلی -->
    <div class="admin-card">

        <!-- آمار -->
        <div class="stats-row" id="statsRow">
            <div class="stat-box">
                <div class="number" id="totalCount">0</div>
                <div class="label">کل رزروها</div>
            </div>
            <div class="stat-box">
                <div class="number" id="todayCount">0</div>
                <div class="label">رزرو امروز</div>
            </div>
        </div>

        <!-- لیست رزروها -->
        <div id="reservationsList">
            <div class="empty-state">
                <i class="fas fa-calendar-check"></i>
                <p>در حال بارگذاری...</p>
            </div>
        </div>

        <!-- دکمه‌ها -->
        <div class="footer-actions">
            <button class="btn-clear-all" onclick="clearAll()">
                <i class="fas fa-trash-alt"></i> پاک کردن همه
            </button>
        </div>

    </div>
</div>

<script>
    // ===== بارگذاری رزروها =====
    function loadReservations() {
        const list = document.getElementById('reservationsList');
        const data = JSON.parse(localStorage.getItem('reservations')) || [];

        // به‌روزرسانی آمار
        document.getElementById('totalCount').textContent = data.length;

        // محاسبه رزروهای امروز
        const today = new Date().toISOString().split('T')[0];
        const todayReservations = data.filter(item => item.checkin === today);
        document.getElementById('todayCount').textContent = todayReservations.length;

        if (data.length === 0) {
            list.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>هیچ رزروی ثبت نشده است.</p>
                </div>
            `;
            return;
        }

        let html = `<div class="reservation-list">`;

        data.forEach((item, index) => {
            // تاریخ شمسی‌سازی ساده
            const checkin = item.checkin ? new Date(item.checkin).toLocaleDateString('fa-IR') : '-';
            const checkout = item.checkout ? new Date(item.checkout).toLocaleDateString('fa-IR') : '-';

            html += `
                <div class="reservation-item">
                    <div class="info">
                        <span class="name">${item.name || 'نامشخص'}</span>
                        <span class="detail"><i class="fas fa-phone"></i> ${item.phone || '-'}</span>
                        <span class="detail"><i class="fas fa-calendar-alt"></i> ورود: ${checkin}</span>
                        <span class="detail"><i class="fas fa-calendar-alt"></i> خروج: ${checkout}</span>
                        <span class="detail"><i class="fas fa-users"></i> ${item.guests || 1} نفر</span>
                    </div>
                    <div class="actions">
                        <button class="btn-delete" onclick="deleteReservation(${index})">
                            <i class="fas fa-times"></i> حذف
                        </button>
                    </div>
                </div>
            `;
        });

        html += `</div>`;
        list.innerHTML = html;
    }

    // ===== حذف یک رزرو =====
    function deleteReservation(index) {
        if (!confirm('آیا از حذف این رزرو مطمئن هستید؟')) return;
        let data = JSON.parse(localStorage.getItem('reservations')) || [];
        data.splice(index, 1);
        localStorage.setItem('reservations', JSON.stringify(data));
        loadReservations();
    }

    // ===== پاک کردن همه =====
    function clearAll() {
        if (!confirm('⚠️ همه رزروها به طور کامل حذف شوند؟')) return;
        localStorage.removeItem('reservations');
        loadReservations();
    }

    // ===== بارگذاری اولیه =====
    document.addEventListener('DOMContentLoaded', loadReservations);
</script>

</body>
</html>
